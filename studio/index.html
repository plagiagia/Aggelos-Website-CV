<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Artist studio — Aggelos Giannoulis</title><link rel="stylesheet" href="/styles.css"><link rel="icon" href="/assets/favicon.svg"><script src="/studio/studio.js" defer></script></head><body><header class="site-header"><a class="wordmark" href="/">Aggelos Giannoulis<span>Artist studio</span></a><nav><a href="/" target="_blank" rel="noopener">View website ↗</a><button id="logout" hidden>Sign out</button></nav></header><main class="studio-main"><h1>Your studio.</h1><p id="studio-status" role="status"></p><form id="login" class="login-form"><p>Sign in to manage your work and read enquiries.</p><label>Studio password<input name="password" type="password" autocomplete="current-password" required></label><button class="solid-button">Sign in ↗</button></form><div id="dashboard" hidden><div class="studio-layout"><section><h2>Works</h2><button id="new-work" class="text-link">Add an artwork +</button><div id="work-list"></div></section><section><h2 id="editor-heading">Add an artwork</h2><form id="editor"><input type="hidden" name="id"><input type="hidden" name="image"><label>Artwork image<input id="upload" type="file" accept="image/jpeg,image/png,image/webp"><span>JPEG, PNG or WebP, up to 3 MB. Upload a photograph of the artwork without captions.</span></label><img class="studio-preview" id="preview" alt="Artwork preview" hidden><label>Title<input name="title" maxlength="250" required></label><div class="form-pair"><label>Year<input name="year" type="number" min="1900" required></label><label>Display order<input name="position" type="number" min="0" max="9999" value="0" required></label></div><label>Medium<input name="medium" value="Colored pencil on paper" maxlength="200" required></label><label>Dimensions (optional)<input name="dimensions" placeholder="e.g. 30 × 42 cm" maxlength="100"></label><label>Image description<input name="alt" maxlength="500" required><span>Describe what is visible for visitors using screen readers.</span></label><label>Notes (optional)<textarea name="notes" rows="3" maxlength="3000"></textarea></label><label class="check-label"><input name="published" type="checkbox" checked>Published on the website</label><div class="studio-actions"><button class="solid-button" id="save">Save artwork ↗</button><button type="button" id="cancel-edit">Clear</button></div><p id="editor-status" role="status"></p></form></section></div><section><h2>Enquiries</h2><p>The most recent 200 messages. Reply by email. Delete messages when you no longer need them.</p><button class="text-link" id="refresh-inbox">Refresh inbox</button><div id="inbox"></div></section></div></main></body></html>
